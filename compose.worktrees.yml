services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: frens
      POSTGRES_PASSWORD: frens
    ports:
      - "${FRENS_POSTGRES_PORT:-55440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frens -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
